services:
  app:
    # Default local-daemon/archive form. Registry mode uses
    # registry.example/service@sha256:REPLACE_WITH_64_HEX_DIGEST instead.
    image: service-name:REPLACE_WITH_RELEASE_ID
    user: "10001:10001"
    read_only: true
    restart: "no"
    labels:
      com.example.service: service-name
      com.example.release: release-id
      com.example.image-transport: local-daemon
      com.example.image-identity: sha256:REPLACE_WITH_LOCAL_IMAGE_ID
    env_file:
      - ${DEPLOY_ROOT}/conf/service-runtime.env
    volumes:
      # External configuration and overrides are read-only.
      - ${DEPLOY_ROOT}/conf:/app/config/overrides:ro
      # Render this as the physical path of the selected release, never current.
      - ${RELEASE_ROOT}/overrides/lib:/app/overrides/lib:ro
      # Business data and logs are explicit; do not use the container layer.
      - ${DEPLOY_ROOT}/data:/app/data
      - ${DEPLOY_ROOT}/logs:/app/logs
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "/app/bin/healthcheck.sh"]
      interval: 5s
      timeout: 3s
      retries: 18

# Render DEPLOY_ROOT as the complete physical service root and RELEASE_ROOT as
# ${DEPLOY_ROOT}/releases/<release-id>. The override source MUST be RELEASE_ROOT,
# never a global ${DEPLOY_ROOT}/overrides directory or a current symlink path.
# The image must pass dockerfile-standard.md before this file is rendered.
# Set com.example.image-transport to registry, local-daemon or archive and
# record the matching manifest digest or local image ID in the release record.
# Do not use service-name:latest as the only deployment identity.
# local-daemon/archive do not run docker login, docker pull or imagetools.
# archive mode verifies the docker save archive SHA-256 before docker load.
# Build-time dependency downloads are allowed only when pinned and verified;
# runtime entrypoint/startup/healthcheck must not download or install resources.
# Prefer an egress-restricted network: allow only declared business dependencies
# such as database/Redis/object storage, not registries or package/model stores.
# Use --network none for services that do not require external dependencies.
# Do not mount overrides/lib on /app/lib: that would hide packaged defaults.
# Add database/index volumes only when the persistence manifest declares them,
# including backup and restore procedures.
